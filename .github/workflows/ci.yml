name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Install Python test dependencies
        # requests: zulip_bridge runtime dep. google-*: gcal tests (mocked service, no network).
        # The zulip package is deliberately absent; the tests stub it.
        run: python -m pip install pytest requests google-api-python-client google-auth google-auth-oauthlib
      - name: Build
        run: make
      - name: Test
        run: python -m pytest tests/ -q

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan every tracked file (generic patterns only, no personal denylist)
        env:
          AI_PRIVATE_PATTERNS: /dev/null
        run: python3 scripts/privacy_check.py --all

  evals-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Build
        run: make
      - name: Run the eval set against the scripted mock LLM
        run: python3 evals/run_evals.py --mock --json evals-mock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-mock
          path: evals-mock.json
